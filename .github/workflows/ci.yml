name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read
  security-events: write
  # Required because the reusable terraform workflow comments the plan
  # back onto the PR. Without this the caller grants pull-requests:none
  # implicitly and GitHub rejects the run with a startup_failure.
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Terraform CI/CD
    # Pinned to a specific commit on gha-workflows for reproducibility.
    # Bump after merging the gha-workflows audit branch and cutting a tag.
    uses: melorga/gha-workflows/.github/workflows/terraform.yml@35859981195311643496aad9ccbcb58e187b3edb
    with:
      terraform_version: '1.15.1'
      working_directory: './infrastructure'
      environment: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
      aws_role_arn: ${{ vars.AWS_OIDC_ROLE_ARN }}
      aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}

  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt
          if [ -f backend/generate-recipe/requirements.txt ]; then
            pip install -r backend/generate-recipe/requirements.txt
          fi

      - name: Run tests
        run: |
          pytest tests/ -v --cov=backend/generate-recipe --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        if: always()
        with:
          files: ./coverage.xml

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  documentation:
    name: Update Documentation
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.15.1'

      - name: Generate terraform-docs
        uses: terraform-docs/gh-actions@v1.3.0
        with:
          working-dir: infrastructure
          output-file: README.md
          output-method: inject
          # Do not silently push docs commits to main; surface the diff in PRs.
          git-push: "false"
